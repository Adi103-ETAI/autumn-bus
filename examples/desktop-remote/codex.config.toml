# Codex reads one config.toml per trusted project, so the per-execution identity
# cannot live in the command line. The controller exports
# AUTUMN_BUS_CONNECTION_FILE into the tmux session environment instead; without
# it the bridge refuses rather than serving an empty tool list.
[mcp_servers.autumn-bus-stdio]
command = "/home/worker/.autumn/servers/<install>/current/bin/autumn-bus"
args = ["mcp", "stdio"]
